# ------------------------------------------------------------- missions
# What a run is for. Ids index the mission tables, so they run 0, 1, 2...
# without gaps. `goal` is what the mission asks for, in its own unit; 0 means
# the mission has no goal and only ends on death. The rule that checks the
# goal is `Game::mission_won` in core/src/game.rs. Names and descriptions are
# `mission.<name>.name` and `.desc` in src/i18n.js.

[[mission]]
id = 0
name = "endless"
goal = 0

# Stay alive for `goal` seconds.
[[mission]]
id = 1
name = "survive"
goal = 300

# Cut down `goal` enemies. There is no time limit.
[[mission]]
id = 2
name = "kills"
goal = 1500

# ---------------------------------------------------------------- state
# Fields of the HUD state buffer written by Game::write_state. `index` is the
# first float. A field with `len` is a run of floats; its constant gets a 0
# suffix (`choice` becomes CHOICE0). `len` is a number or the name of a table
# above, meaning one float per entry ("upgrade" = one per upgrade).

[[state]]
name = "hp"
index = 0

[[state]]
name = "max_hp"
index = 1

[[state]]
name = "xp"
index = 2

[[state]]
name = "xp_next"
index = 3

[[state]]
name = "level"
index = 4

[[state]]
name = "time"
index = 5

[[state]]
name = "kills"
index = 6

[[state]]
name = "choosing"
index = 7

# Offered upgrade ids, -1 for none.
[[state]]
name = "choice"
index = 8
len = 3

[[state]]
name = "over"
index = 11

[[state]]
name = "cam_x"
index = 12

[[state]]
name = "cam_y"
index = 13

[[state]]
name = "enemies"
index = 14

[[state]]
name = "running"
index = 15

# Current level of each upgrade.
[[state]]
name = "upgrade"
index = 16
len = "upgrade"

# Id of the mission being played.
[[state]]
name = "mission"
index = 26

# The mission's goal, and how far along it is, in the same unit.
[[state]]
name = "goal"
index = 27

[[state]]
name = "progress"
index = 28

# 1 once the mission's goal is met. The run stops there.
[[state]]
name = "won"
index = 29

# ------------------------------------------------------------- upgrades
# Ids index the upgrade tables, so they run 0, 1, 2... without gaps.
# `max` is the highest level. `glyph` is the brush mark on cards and HUD
# chips. Card text is `upgrade.<id>.name` and `.desc` in src/i18n.js.

